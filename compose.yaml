name: collab-ledger

services:
  collab-ledger:
    build:
      context: .
      dockerfile: Dockerfile
    image: collab-ledger:latest
    container_name: collab-ledger
    restart: unless-stopped
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${PORT:-8000}:8000"
    environment:
      COLLAB_DB: /data/collab.db
      COLLAB_CORS_ORIGINS: ${COLLAB_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}
      COLLAB_COOKIE_SECURE: ${COLLAB_COOKIE_SECURE:-auto}
      COLLAB_TRUST_PROXY: ${COLLAB_TRUST_PROXY:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://aigw.saurlax.com/}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_CHAT_COMPLETIONS_URL: ${LLM_CHAT_COMPLETIONS_URL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1200}
      LLM_EMBEDDING_URL: ${LLM_EMBEDDING_URL:-}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-text-embedding-3-small}
      RECOMMEND_SKILL_MODE: ${RECOMMEND_SKILL_MODE:-llm}
      RECOMMEND_USE_LLM_SKILL: ${RECOMMEND_USE_LLM_SKILL:-true}
      RECOMMEND_USE_LLM_REASON: ${RECOMMEND_USE_LLM_REASON:-true}
      RECOMMEND_SKILL_AI_WEIGHT: ${RECOMMEND_SKILL_AI_WEIGHT:-0.55}
      RECOMMEND_LLM_TIMEOUT: ${RECOMMEND_LLM_TIMEOUT:-12}
      # D5 外部平台接入：生产环境必须显式注入 APP_ENV 与随机 GITHUB_TOKEN_SECRET
      APP_ENV: ${APP_ENV:-development}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}
      GITHUB_TOKEN_SECRET: ${GITHUB_TOKEN_SECRET:-}
      GITHUB_WEBHOOK_BASE_URL: ${GITHUB_WEBHOOK_BASE_URL:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      COLLAB_FRONTEND_BASE: ${COLLAB_FRONTEND_BASE:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_REDIRECT_URI: ${FEISHU_REDIRECT_URI:-}
      TENCENT_DOC_APP_ID: ${TENCENT_DOC_APP_ID:-}
      TENCENT_DOC_API_BASE: ${TENCENT_DOC_API_BASE:-}
    volumes:
      - collab-ledger-data:/data
      - ./backups:/backups
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

volumes:
  collab-ledger-data:
